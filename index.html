<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Beaufort</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>

<div id="directory">
    <nav>
        <a href="index.html">Homepage</a>
        <a href="your_flashcards.html">Your flashcards</a>
    </nav>
</div>

<div id="everything">
    <h1>
        Copy and paste your input into the textbox below, and then press submit!
    </h1>

    <button id="input-file-instead">
        Actually, I want to use a file instead
    </button>

    <button id="see-more-options">
        See more options
    </button>

    <div id="other-options" style="display: none">
        <label for="generate-flashcards">Create flashcards for me</label>
        <input type="checkbox" id="generate-flashcards">

        <br>
        <br>

        <!-- <button id="use-your-saved-flashcard">Use one of your saved decks</button>-->

        <label for="use-capitalization-for-answers">Use ANSWER instead of _answer_</label>
        <input type="checkbox" id="use-capitalization-for-answers">
        
    </div>


    <div id="file-input-container" style="display: none">
        <br>

        <label id="drop-zone">
            Click to select a file
        </label>
        <input type="file" id="file-input" />
    </div>

    <br>

    <label for="input" id="raw-input-label">Raw input:</label> <br>
    <textarea id="input" rows="50" cols="65"></textarea>

    <br>

    <button id="submit">Submit</button>
</div>

<script src="index.js"></script>

</body>
</html>
